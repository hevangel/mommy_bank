[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mommybank"
version = "1.0.0"
description = "Mommy Bank — a family bank for pocket money and screen time (API + CLI + MCP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "typer>=0.12",
    "mcp>=1.2,<2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mommybank = "mommybank.cli:main"

[tool.setuptools.packages.find]
include = ["mommybank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
